'use strict';
const $=s=>document.querySelector(s),KEY='squall-ff1-guide-v1',E=DATA.enemies,R=DATA.route;
let state={version:1,checks:{},notes:{},area:0,hideObtained:false},tab='route',query='',missing=false;
try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&old.version===1&&old.checks){state={...state,...old};state.area=Math.max(0,Math.min(R.length-1,Number(state.area)||0));}}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const on=id=>state.checks[id]===true;
const chestMap=new Map();R.forEach(r=>{if(r.chest)chestMap.set(r.chest.id,r.chest)});const C=[...chestMap.values()];
const finish=[['t-story','Story complete','Defeat Chaos and let the ending and credits finish.'],['t-class','Token of Courage','Show Bahamut the Rat’s Tail and receive the class upgrades.'],['t-sword','Sword of Myth','Give Smyth the Adamantite and collect Excalibur.'],['t-puzzle','Hidden Game','Play the ship’s 15 Puzzle. With default PlayStation controls, hold Cross and press Circle repeatedly (about 55 times) while aboard.'],['t-level','Seasoned Hero','All four party members reach level 50.'],['t-kills','Legendary Warrior','Defeat 500 monsters; the 100 and 300 milestones are covered on the way.'],['t-gil','Moneybags','Obtain 100,000 gil in total; the 10,000 and 50,000 milestones are covered on the way.'],['t-maps','Adventurous Wayfarer','Visit all map locations. Check every Dragon Cave entrance and every town, including Lufenia.'],['t-chests','Legendary Treasure Hunter','Confirm the in-game chest trophy unlocked; the ledger should total 249.'],['t-bestiary','Field Research – Professional','Confirm 128/128 entries in-game, including Chaos.'],['t-platinum','Master of I','Confirm all other trophies and the platinum have unlocked.']];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('#saveStatus').textContent='Saved in this browser • export for a backup';}catch(e){$('#saveStatus').textContent='Saving unavailable — export progress before closing';}}
function toast(s){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.role='status';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),4500)}
function check(id,label,detail='',cls=''){return `<label class="check ${on(id)?'checked':''} ${cls}"><input type="checkbox" data-check="${esc(id)}" ${on(id)?'checked':''}><span class="text"><span class="label">${label}</span>${detail?`<small>${esc(detail)}</small>`:''}</span></label>`}
function enemy(n,loc=false){
 const e=E[n-1],x=R[state.area].encounters?.[n],later=e.routeVisits.find(i=>i>state.area);
 const last=!loc&&x?.available&&e.lastRoute===state.area&&x.kind!=='story';
 const kind=!loc&&x?x.kind:'';
 const badge=(text,title,style='')=>`<span class="encbadge ${style}" title="${esc(title)}" aria-label="${esc(title)}">${text}</span>`;
 let flags='';
 if(last)flags+=badge('↩ LAST','Last planned stop on this route with this enemy. After leaving, an extra return or detour is needed. Not permanently missable.','lastchance');
 if(kind==='fixed')flags+=badge('◆ FIXED','A chest, guard tile or scripted fight provides this enemy. Read the location hint.','fixedflag');
 if(kind==='story')flags+=badge('★ STORY','Required story fight; no random-encounter hunt needed.');
 if(kind==='key')flags+=badge('◇ KEY','Not available on this visit: return after obtaining the Mystic Key.');
 if(kind==='next')flags+=badge('→ NEXT','This spawn area is visited in the next step, not the current town.');
 const hint=loc?(e.hint||R[e.routeVisits[0]].encounters[n].hint):(x?.hint||e.hint||'See Bestiary for locations');
 const html=check('e'+n,`<span class="enemyid">${String(n).padStart(3,'0')}</span>${esc(e.name)}${flags}`,hint);
 const schedule=loc?('Last planned opportunity: step '+(e.lastRoute+1)+' — '+R[e.lastRoute].title):(later===undefined?'No later scheduled visit listed.':('Later opportunity: step '+(later+1)+' — '+R[later].title));
 return html.replace('<span class="text">',`<span class="text" title="${esc(schedule)}">`);
}
function stepKeys(i){const r=R[i];return [...r.tasks.map((_,j)=>`s${i}t${j}`),...(r.chest&&r.chest.final?['c'+r.chest.id]:[])];}
function stats(){const en=E.filter(e=>on('e'+e.id)).length,cn=C.reduce((n,c)=>n+(on('c'+c.id)?c.count:0),0),rn=R.filter((r,i)=>stepKeys(i).every(on)).length;$('#stats').innerHTML=[[en,128,'BESTIARY ENTRIES'],[cn,249,'CHESTS IN COMPLETED AREAS'],[rn,R.length,'ROUTE STEPS COMPLETE']].map(([a,b,l])=>`<div class="stat"><div class="small subtle">${l}</div><div class="number">${a} <span>/ ${b}</span></div><div class="bar"><i style="width:${a/b*100}%"></i></div></div>`).join('');$('#navCount').textContent=String(R.length).padStart(2,'0');$('#routeNav').innerHTML=R.map((r,i)=>{const done=stepKeys(i).every(on);return `<button class="routebutton ${i===state.area&&tab==='route'?'active':''} ${done?'complete':''}" data-area="${i}" ${i===state.area&&tab==='route'?'aria-current="step"':''}><span>${done?'✓':String(i+1).padStart(2,'0')}</span><span>${esc(r.title)}</span></button>`}).join('');}
function render(){stats();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const v=$('#view');
if(tab==='route'){
 const i=state.area,r=R[i],un=(r.enemies||[]).filter(n=>!on('e'+n)),visible=state.hideObtained?un:(r.enemies||[]);
 v.innerHTML=`<div class="stephead"><div class="eyebrow">${esc(r.chapter)}</div><div class="count">STEP ${String(i+1).padStart(2,'0')} / ${R.length}</div></div><h1>${esc(r.title)}</h1><p class="intro">Follow the directions below, tick your objectives and bestiary, then continue to the next destination.</p><section class="panel directions"><div class="eyebrow">Where to go · who to speak to</div><h2>Directions for this step</h2><ol class="tips">${r.travel.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><div class="nextdestination"><strong>Next destination</strong><br>${esc(r.travel.next)}</div><p class="source">Direction references: ${esc(r.pages)}; PSNP travel passages between chapters; Steam early Elfheim/Marsh route.</p></section><div class="contentgrid"><div><section class="panel"><div class="panelhead"><h2>Your next moves</h2><span class="tag">${stepKeys(i).filter(on).length}/${stepKeys(i).length} DONE</span></div>${r.tasks.map((t,j)=>check(`s${i}t${j}`,esc(t))).join('')}${r.chest?check('c'+r.chest.id,`All ${r.chest.count} chests — ${esc(r.chest.label)}`,r.chest.final?'Check only when the in-game area counter is complete.':'Return visit required. Leave this unchecked until the entire area is complete.') : ''}</section>${r.tips?.length?`<section class="panel"><h2>Before you leave</h2><ul class="tips">${r.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>`:''}${r.boss?`<section class="panel boss"><div class="eyebrow">Battle plan</div><p>${esc(r.boss)}</p></section>`:''}<details class="panel"><summary>Your notes for this step</summary><textarea id="notes" aria-label="Notes for this step" placeholder="A chest to revisit, a spell to buy…">${esc(state.notes[i]||'')}</textarea></details><p class="source">Source references: ${esc(r.pages)}. See Sources for guide credits and corrections.</p></div><section class="panel"><div class="panelhead"><h2>Area bestiary</h2><span class="tag">${un.length} LEFT</span></div><label class="area-filter small"><input type="checkbox" id="hideObtained" ${state.hideObtained?'checked':''}> Hide obtained</label><div class="small subtle">Each hint names the spawn area for this step. Toggle “Hide obtained” to shorten this list. <span class="legendlast">↩ LAST</span> = finish before leaving to avoid a return trip. <details class="enclegend"><summary>Encounter symbols &amp; missables</summary><p>◆ FIXED = chest, guard tile or scripted fight. ★ STORY = required boss. ◇ KEY = locked until the Mystic Key. → NEXT = spawn area visited next step. Hover an enemy’s text for its next scheduled opportunity.</p><p>↩ LAST marks the final scheduled visit to a listed spawn area in this route, including planned return trips; optional cleanup and free travel do not count. It is a routing warning, not permanent missability. The supplied guides identify no permanently missable optional bestiary entries in FFI Pixel Remaster; mandatory bosses are marked STORY. Fixed fights may be one-off, so confirm the entry after them.</p><p>Overworld regions are not the whole continent. Follow the named town, terrain or travel leg. Where the supplied sources give no reliable floor, the hint deliberately stays at dungeon level. Different floors can have different encounters.</p></details></div>${visible.length?visible.map(n=>enemy(n)).join(''):(r.enemies||[]).length?'<p class="empty">All encounters here obtained. Turn off “Hide obtained” to show them.</p>':'<p class="empty">No new encounter list for this stop.</p>'}</section></div><div class="navbottom"><button data-go="-1" ${i===0?'disabled':''}>← Previous area</button><button class="primary" data-go="1" ${i===R.length-1?'disabled':''}>Next area →</button></div>`;
}else if(tab==='bestiary'){
 v.innerHTML=`<div class="eyebrow">Field research</div><h1>Every encounter counts.</h1><p class="intro">All 128 entries, linked to your walkthrough. Search by name or bestiary number. Location hints distinguish fixed fights from random encounters. In the journey, ↩ LAST marks the final scheduled opportunity before a return trip.</p><div class="searchrow"><input type="search" id="search" placeholder="Search enemies or number…" value="${esc(query)}" aria-label="Search bestiary"><label><input type="checkbox" id="missing" ${missing?'checked':''}> Only unchecked</label></div><div class="panel"><div class="enemygrid" id="enemyResults"></div></div>`;results();
}else if(tab==='chests'){
 v.innerHTML=`<div class="eyebrow">Treasure ledger</div><h1>One box per area.</h1><p class="intro">Check an area only when its in-game chest counter is full. The top total counts whole completed areas, not individual opened chests. Partial visits stay in the walkthrough objectives.</p><div class="notice">Mystic Key returns: Cornelia Castle, Chaos Shrine, Elven Castle, Western Keep and Marsh Cave. Cavern of Earth also needs a second story visit.</div><section class="panel chestgrid">${C.map(c=>check('c'+c.id,`${esc(c.label)} <span class="pill">${c.count} CHESTS</span>`)).join('')}</section>`;
}else if(tab==='finish'){
 v.innerHTML=`<div class="eyebrow">Final sweep</div><h1>Ready for platinum.</h1><p class="intro">These checks record actual in-game trophy unlocks. They are deliberately separate from route objectives and do not unlock automatically.</p><div class="notice">The guides describe no permanently missable collectibles in FFI. Keep a manual save before the final dungeon anyway, and finish rare-enemy cleanup before Chaos to avoid extra trips.</div><section class="panel">${finish.map(([id,a,b])=>check(id,esc(a),b)).join('')}</section><section class="panel"><h2>Keep the run moving</h2><ul class="tips"><li>Use the map’s area treasure counts; you do not need every shop item or every spell for platinum.</li><li>Combine necessary battles with bestiary hunting and level 50 progress. Keep all party members alive when earning experience.</li><li>If you use the game’s built-in boosts, increased EXP and gil can shorten grinding. Keep random encounters enabled while filling enemy entries; switch them off only for already-cleared travel.</li><li>Keep unique equipment that casts spells. Healing equipment, Giant’s Gloves, Haste and Temper reduce resource use and shorten boss fights.</li><li>For a leaderboard-timed run, check the current leaderboard rules yourself; this checklist is a completion route, not a verified speedrun ruleset.</li></ul></section>`;
}else{
 v.innerHTML=`<div class="eyebrow">A companion for your second screen</div><h1>Play. Check. Continue.</h1><section class="panel"><h2>How progress works</h2><ul class="tips"><li>Walkthrough follows PSNProfiles’ chapter order. Choose any area in the left sidebar; you can move on even with unfinished checks.</li><li>Enemy entries sync everywhere. Tick only after confirming the entry in your in-game bestiary. Defeating each enemy is the conservative route; Steam says an encounter can suffice, but this guide does not rely on that claim.</li><li>A route step is complete when its objectives and final-visit chest box are checked. Enemy progress is tracked independently so rare encounters do not block navigation.</li><li>This file works offline. Progress and notes save only in this browser on this device. Keep the HTML file in the same folder with the same filename; moving it may give it a separate browser save. Export regularly; import your JSON backup to transfer to another browser. Clearing browser data removes local progress.</li><li>There are 18 chest groups totaling 249 chests, plus 128 bestiary entries. Dragon Caves use one grouped box across the islands.</li><li>No separate hidden-item counter is asserted: use the chest checks and story/key-item tasks provided by these FFI sources.</li></ul></section><section class="panel"><h2>Sources & verification</h2><p><a href="https://psnprofiles.com/guide/16575-final-fantasy-pixel-remaster-walkthrough" target="_blank" rel="noopener">PSNProfiles — Final Fantasy Pixel Remaster Walkthrough</a><br><span class="small subtle">Primary source: supplied 187-page PDF, printed 24 October 2026. By AquaNSky, jermthejerm, RaveNScythE18, The_Kopite, Xillynoc and zekunlu. Route, bestiary numbers and boss preparation.</span></p><p><a href="https://steamcommunity.com/sharedfiles/filedetails/?id=2561862011" target="_blank" rel="noopener">Silicis — Final Fantasy 100% guide simplified</a><br><span class="small subtle">Secondary source: supplied 25-page PDF. Chest totals, practical routing and rare-enemy hints. PlayStation inputs are not taken from its Xbox examples.</span></p><p><a href="https://www.playstationtrophies.org/game/final-fantasy-1-pixel-remaster/print-list/" target="_blank" rel="noopener">PlayStationTrophies — PlayStation trophy list</a><br><span class="small subtle">Cross-check for platinum requirements, especially level 50 for every party member.</span></p><p><a href="https://steamcommunity.com/sharedfiles/filedetails/?id=2567260207" target="_blank" rel="noopener">Ashoka — FINAL FANTASY | 100% Bestiary Completion Guide</a><br><span class="small subtle">Supplied 25-page PDF: cross-check for enemy locations and revisitable areas. Names normalized: Terra Cavern = Cavern of Earth; Titan’s Cave = Giant’s Cave. The older guide has omissions and floor-label typos; PSNProfiles remains the route authority.</span></p><p class="small subtle">Additional checks: Final Fantasy Wiki Pixel Remaster formation tables for Anaconda, Ghost, Black Flan, Piranha, Hydra, Fire Hydra, Air Elemental, Dark Fighter and Death Eye. Western Keep and Marsh Cave treasure fights cross-checked against Silicis pp. 7–8 and PSNP pp. 43–44, 50–51. Chest/guard-tile triggers are labeled FIXED without assuming every fixed fight is repeatable.</p><h3>Editorial checks</h3><p class="small subtle">PSNProfiles contains a “009 Wolf” typo near Melmond; 003 is Wolf and 009 is Werewolf. Marsh Cave’s 15 early chests plus 3 locked chests make 18. Chest sweeps use full-area totals to avoid double-counting. Enemy weaknesses are omitted where the tables disagree. Western Keep now lists Mummy and Wraith instead of an incorrectly reused Marsh Cave list. Anaconda is marked as the locked Silver Armlet encounter at Marsh Cave, with a random B1 alternative at Cavern of Earth. River and sea lists repeat on the actual transport legs, and checked entries remain visible unless “Hide obtained” is enabled. Last-stop markers are calculated from this guide’s scheduled visits, not from game lockouts. This is an independently written checklist, not a reproduction of either walkthrough. Refer to the credited guides for maps and detailed chest-by-chest directions.</p></section><details class="panel"><summary>Start a new checklist</summary><p class="settingsnote">Export first if you want to keep this run. Reset removes only this guide’s local progress.</p><button id="reset">Reset all progress…</button></details>`;
}
}
function results(){let list=E.filter(e=>(!missing||!on('e'+e.id))&&(`${String(e.id).padStart(3,'0')} ${e.name}`).toLowerCase().includes(query.toLowerCase()));$('#enemyResults').innerHTML=list.length?list.map(e=>enemy(e.id,true)).join(''):'<p class="empty">No matching entries.</p>'}
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.check){state.checks[el.dataset.check]=el.checked;save();stats();el.closest('.check').classList.toggle('checked',el.checked);if(tab==='route')render();if(tab==='bestiary'&&missing)results();}if(el.id==='hideObtained'){state.hideObtained=el.checked;save();render();}if(el.id==='missing'){missing=el.checked;results();}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){query=ev.target.value;results()}if(ev.target.id==='notes'){state.notes[state.area]=ev.target.value;save()}});
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.area!==undefined){state.area=+b.dataset.area;tab='route';save();render();window.scrollTo(0,0)}if(b.dataset.go){state.area=Math.max(0,Math.min(R.length-1,state.area+Number(b.dataset.go)));save();render();window.scrollTo(0,0)}if(b.id==='reset'&&confirm('Reset this guide’s progress and notes? Export a backup first if needed.')){state={version:1,checks:{},notes:{},area:0};save();tab='route';render();toast('Checklist reset.')}});
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({...state,guide:'ff1-platinum-field-guide'},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='FF1-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Progress backup exported.')};
$('#import').onclick=()=>$('#file').click();
$('#file').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(p.guide!=='ff1-platinum-field-guide'||p.version!==1||!p.checks||typeof p.checks!=='object'||Array.isArray(p.checks)||!p.notes||typeof p.notes!=='object'||Array.isArray(p.notes)||!Number.isInteger(p.area)||p.area<0||p.area>=R.length||Object.values(p.checks).some(v=>typeof v!=='boolean')||Object.values(p.notes).some(v=>typeof v!=='string'))throw Error('Invalid backup');if(!confirm('Replace the current checklist with this backup?'))return;state={version:1,checks:p.checks,notes:p.notes,area:p.area,hideObtained:p.hideObtained===true};save();render();toast('Backup restored.')}catch(e){toast('Could not import: choose a valid FF1 progress backup.')}finally{ev.target.value=''}};
render();
